---
layout: default
---

<div class="row g-5">
  <div class="col-md-8">
    <article class="blog-post">
      <h1 class="display-5 link-body-emphasis mb-1">{{ page.title }}</h1>
      <p class="blog-post-meta">
        {{ page.date | date: "%B %d, %Y" }} by {{ page.author | default: "Admin" }}
      </p>

      {{ content }}
    </article>
  </div>

  <div class="col-md-4">
    {% include sidebar.html %}
  </div>
</div>
