---
layout: default
---

<div class="intro">
  <div class="container">
    <div class="row">
      <div class="col-12 col-lg-9">
        <h1>{{ page.title }}</h1>
        <p class="mb-0">{{ page.date | date: "%Y-%m-%d" }}</p>
        <p class="mb-0">
          <a href="/blog/">{% if site.lang == "ru" %}← Назад в блог{% endif %}{% if site.lang == "rs" %}← Nazad na blog{% endif %}{% if site.lang == "en" %}← Back to blog{% endif %}</a>
        </p>
      </div>
    </div>
  </div>
</div>

<div class="strip">
  <div class="container section-wrap">
    <div class="row">
      <div class="col-12 col-lg-9 content line-numbers"">
        {{ content }}
      </div>
    </div>
  </div>
</div>
