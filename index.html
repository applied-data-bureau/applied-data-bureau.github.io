---
layout: default
title: Home
---

          <h2 class="pb-4 mb-4 fst-italic border-bottom">Блог, последние публикации</h2> 


  {% for post in site.posts %}
           <article class="blog-post">
            <h3 class=" link-body-emphasis mb-1">{{ post.title  }}</h3>
            <p class="blog-post-meta">
              {{ post.date | date: "%b %d" }}
            </p>
<a href="{{ post.url }}" class="stretched-link">#link</a>
{{ post.content  }}
          </article>
  {% endfor %}


 <nav class="blog-pagination" aria-label="Pagination">
            <a class="btn btn-outline-primary rounded-pill" href="#">Older</a>
            <a
              class="btn btn-outline-secondary rounded-pill disabled"
              aria-disabled="true"
              >Newer</a
            >
          </nav>
